<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>视频测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #131524;
            --bg-secondary: #1a1d2e;
            --bg-card: rgba(38, 41, 58, 0.65);
            --accent-blue: #5b8def;
            --accent-blue-light: #7ca6f3;
            --accent-cyan: #4ecdc4;
            --accent-green: #5dbe8d;
            --accent-orange: #f4a261;
            --text-primary: #e8eaf0;
            --text-secondary: #9aa3b2;
            --text-tertiary: #6b7280;
            --border-subtle: rgba(91, 141, 239, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        /* 顶部导航 */
        .page-header {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            position: relative;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .back-btn:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        .page-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 主内容 */
        .main-content {
            flex: 1;
            padding: 12px 16px 24px;
        }

        /* 视频播放区 */
        .video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .video-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1d2e, #0d0f1a);
            color: var(--text-tertiary);
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .video-fallback svg {
            width: 48px;
            height: 48px;
            fill: var(--text-tertiary);
            margin-bottom: 10px;
            opacity: 0.6;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .video-overlay.show {
            opacity: 1;
        }

        .video-overlay .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 开始测试按钮 */
        .start-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 28px;
            transition: transform 0.15s, opacity 0.2s;
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.35);
        }

        .start-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .start-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        /* 测试结果 */
        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            overflow: hidden;
        }

        .result-item {
            background: var(--bg-card);
            padding: 18px 10px;
            text-align: center;
        }

        .result-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .result-value .unit {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 2px;
            font-weight: 500;
        }

        /* 评分卡 Apple 风格：单行紧凑，细竖条点缀，系统字体 */
        .score-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            margin-bottom: 14px;
            border-radius: 14px;
            background: rgba(26, 29, 46, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
            gap: 16px;
        }

        /* 左侧一道等级色细竖条，轻声点缀 */
        .score-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 16px;
            bottom: 16px;
            width: 3px;
            border-radius: 3px;
            background: var(--score-color, var(--accent-green));
            transition: background 0.4s;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            line-height: 1;
        }

        .score-num {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .score-total {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-left: 3px;
            letter-spacing: 0.2px;
        }

        .score-pipe {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.12);
        }

        .score-heading {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-badge {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .score-verdict {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        /* 测试完成提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 200;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
            <div class="page-title">视频测试</div>
        </header>

        <main class="main-content">
            <div class="video-wrap">
                <video id="testVideo"
                       poster="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg"
                       preload="metadata"
                       playsinline
                       muted>
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                </video>
                <div class="video-overlay" id="videoOverlay">
                    <div class="spinner"></div>
                    <span id="overlayText">测试中…</span>
                </div>
                <div class="video-fallback" id="videoFallback" style="display:none;">
                    <div style="display:flex;flex-direction:column;align-items:center;">
                        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                        <span>视频加载失败，请检查网络</span>
                    </div>
                </div>
            </div>

            <button class="start-btn" id="startBtn" onclick="startVideoTest()">开始测试</button>

            <div class="result-title">测试结果</div>
            <div class="score-card" id="scoreCard" style="display:none;">
                <div class="score-row">
                    <span class="score-num" id="scoreNum">-</span>
                    <span class="score-total">/100</span>
                </div>
                <span class="score-pipe"></span>
                <div class="score-heading">
                    <span class="score-badge" id="scoreBadge">良好</span>
                    <span class="score-verdict" id="scoreVerdict">—</span>
                </div>
            </div>
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-label">视频时长</div>
                    <div class="result-value" id="resDuration">-<span class="unit">s</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">停顿次数</div>
                    <div class="result-value" id="resStalls">-<span class="unit">次</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">缓冲时长</div>
                    <div class="result-value" id="resBuffer">-<span class="unit">s</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">停顿时长</div>
                    <div class="result-value" id="resStallTime">-<span class="unit">s</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">下载时间</div>
                    <div class="result-value" id="resDownloadTime">-<span class="unit">s</span></div>
                </div>
                <div class="result-item">
                    <div class="result-label">下载速率</div>
                    <div class="result-value" id="resRate">-<span class="unit">kbps</span></div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast">测试完成</div>

    <script>
        const video = document.getElementById('testVideo');
        const overlay = document.getElementById('videoOverlay');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');
        const toast = document.getElementById('toast');

        let testing = false;

        // 视频加载失败时显示占位提示
        video.addEventListener('error', () => {
            document.getElementById('videoFallback').style.display = '';
        });

        function showToast(msg, duration = 1600) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function setText(id, value, unit = '') {
            document.getElementById(id).innerHTML = value + '<span class="unit">' + unit + '</span>';
        }

        const RING_LEN = 0;

        // 计算综合评分（0~100，整数），并映射等级、色调
        function calcScore(data) {
            let score = 100;
            score -= data.stalls * 6;            // 每次停顿
            score -= data.bufferTime * 4;        // 缓冲时长
            score -= data.stallTime * 1.2;       // 停顿时长
            if (data.rate < 400) score -= (400 - data.rate) / 25; // 过低速率
            score = Math.round(Math.max(58, Math.min(99, score)));
            return score;
        }

        // 更新评分卡（大分数 + 等级 + 三个维度点）
        function renderScore(data) {
            const card = document.getElementById('scoreCard');
            card.style.display = '';
            const score = calcScore(data);

            const levels = [
                { min: 90, label: '优秀', color: '#4ecdc4', verdict: '播放极致流畅，体验出色' },
                { min: 78, label: '良好', color: '#5b8def', verdict: '播放流畅，偶有轻微停顿' },
                { min: 66, label: '一般', color: '#f4a261', verdict: '播放存在卡顿，建议优化网络' },
                { min: 0,  label: '较差', color: '#f87171', verdict: '卡顿明显，网络质量待改善' }
            ];
            const lv = levels.find(l => score >= l.min);

            // 大分数 + 等级 + 结论
            document.getElementById('scoreNum').textContent = score;
            const badge = document.getElementById('scoreBadge');
            badge.textContent = lv.label;
            badge.style.color = lv.color;
            document.getElementById('scoreVerdict').textContent = lv.verdict;

            // 左竖条随等级着色
            card.style.setProperty('--score-color', lv.color);
        }

        function startVideoTest() {
            if (testing) return;
            testing = true;
            startBtn.disabled = true;
            startBtn.textContent = '测试中…';

            // 生成与截图风格一致的模拟数据
            const duration = +(9 + Math.random() * 50).toFixed(1);      // 视频时长 9~59 s
            const stalls = Math.floor(Math.random() * 4);               // 停顿 0~3 次
            const bufferTime = +(Math.random() * 1.5).toFixed(2);       // 缓冲时长
            const stallTime = +(stalls * (1 + Math.random() * 4)).toFixed(2); // 停顿时长
            const downloadTime = +(duration * (0.4 + Math.random() * 0.5)).toFixed(2); // 下载时间
            const rate = +((duration * 1024 * 8 / 1000) / Math.max(downloadTime, 0.1)).toFixed(2); // kbps

            setText('resDuration', duration, 's');
            setText('resStalls', stalls, '次');
            setText('resBuffer', bufferTime, 's');
            setText('resStallTime', stallTime, 's');
            setText('resDownloadTime', downloadTime, 's');
            setText('resRate', rate, 'kbps');

            // 即时展示综合评分
            renderScore({ stalls, bufferTime, stallTime, rate });

            overlay.classList.remove('show');
            showToast('测试完成');

            startBtn.disabled = false;
            startBtn.textContent = '重新测试';
            testing = false;
        }
    </script>
</body>
</html>
